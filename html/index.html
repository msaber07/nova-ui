<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Nova UI</title>
</head>
<body>
  <div id="notify-stack" aria-live="polite"></div>

  <div id="document-card" class="hidden">
    <div class="document-head">
      <span id="document-badge">N</span>
      <div class="document-headtext">
        <p id="document-kicker">DOCUMENT</p>
        <h1 id="document-title">Document</h1>
      </div>
      <button id="document-close" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div id="document-fields"></div>
    <p id="document-footer">Roleplay</p>
    <span id="document-line"></span>
  </div>

  <div id="progress-wrap" class="hidden">
    <div class="progress-meta">
      <span id="progress-label">Working...</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-track">
      <span id="progress-fill"></span>
    </div>
  </div>

  <div id="textui" class="hidden" data-position="right-center">
    <span id="textui-icon" class="hidden"></span>
    <span id="textui-label">Hint</span>
  </div>

  <div id="confirm-layer" class="hidden">
    <section class="confirm-card">
      <div class="confirm-head">
        <span class="confirm-dot"></span>
        <h1 id="confirm-title">Confirm</h1>
      </div>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-reject" class="btn btn-ghost" type="button">Decline</button>
        <button id="confirm-accept" class="btn btn-accent" type="button">Accept</button>
      </div>
      <div class="confirm-progress"><span id="confirm-progress-fill"></span></div>
    </section>
  </div>

  <!-- Context Menu Layer -->
  <div id="menu-layer" class="hidden">
    <section class="menu-card">
      <header class="menu-head">
        <span class="menu-dot"></span>
        <h1 id="menu-title">Menu</h1>
      </header>
      <div id="menu-options"></div>
    </section>
  </div>

  <!-- Input Dialog Layer -->
  <div id="input-layer" class="hidden">
    <section class="input-card">
      <header class="input-head">
        <span class="input-dot"></span>
        <h1 id="input-title">Input Dialog</h1>
      </header>
      <form id="input-form">
        <div id="input-fields"></div>
        <div class="input-actions">
          <button id="input-cancel" class="btn btn-ghost" type="button">Cancel</button>
          <button id="input-submit" class="btn btn-accent" type="submit">Submit</button>
        </div>
      </form>
    </section>
  </div>

  <!-- Skill Check Layer -->
  <div id="skillcheck-layer" class="hidden">
    <div class="skillcheck-container">
      <svg class="skillcheck-svg" viewBox="0 0 100 100">
        <circle class="skillcheck-bg" cx="50" cy="50" r="40" />
        <path id="skillcheck-target" class="skillcheck-target" d="M 50 10 A 40 40 0 0 1 90 50" />
        <line id="skillcheck-needle" class="skillcheck-needle" x1="50" y1="50" x2="50" y2="10" />
      </svg>
      <div class="skillcheck-center">
        <span id="skillcheck-key">E</span>
        <div id="skillcheck-stage" class="hidden">1/3</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
